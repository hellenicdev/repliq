# Render blueprint: deploys the FastAPI backend as a Docker web service.
# FFmpeg is installed inside the image (backend/Dockerfile).
# Frontend is hosted on GitHub Pages at https://hellenicdev.eu/repliq/

services:
  - type: web
    name: repliq-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContextPath: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false # set in Render dashboard
      - key: MONGODB_DATABASE
        value: dialogue_video
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_ENFORCED
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: CORS_ORIGINS
        value: "https://hellenicdev.eu,http://hellenicdev.eu"
      - key: MEDIA_ROOT
        value: /tmp/media
      - key: STORAGE_BACKEND
        value: local
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: MAX_CLIPS
        value: "12"
      - key: MAX_TOTAL_DURATION
        value: "30.0"
